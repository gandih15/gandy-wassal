name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        env:
          WASSAL_SECRET: ${{ secrets.WASSAL_SECRET }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/*.apk GandyWassal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GandyWassal-apk
          path: GandyWassal.apk

      # رابط ثابت للعملاء: releases/latest/download/GandyWassal.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: غاندي وصّل v1.0.${{ github.run_number }}
          make_latest: true
          files: GandyWassal.apk
